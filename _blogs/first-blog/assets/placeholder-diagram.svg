<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Input, model, output</title>
  <desc id="desc">An input passes through a model to produce an output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52749b"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="20" fill="#f3f5f8"/>
  <g fill="#ffffff" stroke="#aabbd0" stroke-width="2">
    <rect x="60" y="65" width="200" height="150" rx="16"/>
    <rect x="380" y="65" width="200" height="150" rx="16"/>
    <rect x="700" y="65" width="200" height="150" rx="16"/>
  </g>
  <g stroke="#52749b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 280 140 H 357"/>
    <path d="M 600 140 H 677"/>
  </g>
  <g fill="#1a3654" font-family="Georgia, serif" font-style="italic" font-size="62" text-anchor="middle">
    <text x="160" y="159">x</text>
    <text x="480" y="159">f</text>
    <text x="800" y="159">y</text>
  </g>
</svg>
