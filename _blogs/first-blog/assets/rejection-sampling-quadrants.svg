<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Choosing trajectories for training</title>
  <desc id="description">Four qualitative quadrants of task difficulty and model performance. Quadrant I: hard tasks with good performance, prioritize for training. Quadrant II: easy tasks with good performance, lower learning priority. Quadrant III: easy tasks with poor performance, downweight or reject. Quadrant IV: hard tasks with poor performance, inspect verified partial reasoning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#52606c" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #25343e; }
      .number { font-size: 23px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 31px; font-weight: 600; }
      .performance { font-size: 27px; }
      .meaning { font-size: 24px; }
      .action { font-size: 24px; font-weight: 600; }
      .axis { font-size: 25px; font-weight: 600; }
      .hint { font-size: 20px; fill: #687680; }
    </style>
  </defs>
  <rect width="1200" height="900" rx="24" fill="#fcfcfa"/>
  <text x="76" y="65" font-size="35" font-weight="600">Choosing trajectories for training</text>
  <text x="76" y="104" font-size="24" fill="#687680">Task difficulty × model performance</text>

  <rect x="140" y="169" width="470" height="278" rx="22" fill="#e5edf4"/>
  <rect x="644" y="169" width="470" height="278" rx="22" fill="#e4eee6"/>
  <rect x="140" y="481" width="470" height="278" rx="22" fill="#f3e4de"/>
  <rect x="644" y="481" width="470" height="278" rx="22" fill="#ebe5f2"/>

  <g transform="translate(174 213)">
    <text class="number" fill="#59778e">II</text>
    <text y="46" class="heading">Easy task</text>
    <text y="84" class="performance">Good performance</text>
    <text y="129" class="meaning">Already mastered</text>
    <path d="M 0 149 H 44" stroke="#93aebe" stroke-width="3" stroke-linecap="round"/>
    <text y="190" class="action">Lower learning priority</text>
  </g>
  <g transform="translate(678 213)">
    <text class="number" fill="#557860">I</text>
    <text y="46" class="heading">Hard task</text>
    <text y="84" class="performance">Good performance</text>
    <text y="129" class="meaning">High-value success</text>
    <path d="M 0 149 H 44" stroke="#8caa92" stroke-width="3" stroke-linecap="round"/>
    <text y="190" class="action">Prioritize for training</text>
  </g>
  <g transform="translate(174 525)">
    <text class="number" fill="#a16f5e">III</text>
    <text y="46" class="heading">Easy task</text>
    <text y="84" class="performance">Poor performance</text>
    <text y="129" class="meaning">Low-value failure</text>
    <path d="M 0 149 H 44" stroke="#c69c8c" stroke-width="3" stroke-linecap="round"/>
    <text y="190" class="action">Downweight or reject</text>
  </g>
  <g transform="translate(678 525)">
    <text class="number" fill="#806c99">IV</text>
    <text y="46" class="heading">Hard task</text>
    <text y="84" class="performance">Poor performance</text>
    <text y="129" class="meaning">Partial reasoning may help</text>
    <path d="M 0 149 H 44" stroke="#ac9abf" stroke-width="3" stroke-linecap="round"/>
    <text y="183" class="action">Verify useful reasoning</text>
    <text y="215" font-size="20" fill="#687680">Do not imitate incorrect traces</text>
  </g>

  <path d="M 125 464 H 1144" fill="none" stroke="#52606c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 627 774 V 142" fill="none" stroke="#52606c" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="627" cy="464" r="5" fill="#fcfcfa" stroke="#52606c" stroke-width="2"/>
  <text x="47" y="464" class="axis" text-anchor="middle" transform="rotate(-90 47 464)">Model performance</text>
  <text x="94" y="191" class="hint" text-anchor="middle">High</text>
  <text x="94" y="746" class="hint" text-anchor="middle">Low</text>
  <text x="627" y="813" class="axis" text-anchor="middle">Task difficulty</text>
  <text x="140" y="813" class="hint">Low</text>
  <text x="1114" y="813" class="hint" text-anchor="end">High</text>
  <text x="627" y="860" class="hint" text-anchor="middle">Qualitative axes · Center = typical difficulty and performance</text>
</svg>
